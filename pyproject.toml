[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jptrainer"
version = "0.2.0"
description = "Jazz Piano Trainer"
readme = "README.md"
license = { file = "LICENSE" }
authors = [ { name = "2CoderOK" } ]
requires-python = ">=3.10"
keywords = ["audio", "piano", "sampler", "jazz", "trainer"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

dependencies = [
    "piano-sampler>=0.1.1",
    "mido==1.3.3", 
    "pygame==2.6.1",
    "python-rtmidi==1.5.8",
    "Pillow==12.1.1"
]

[project.scripts]
jptrainer = "jptrainer.main:main"

[project.urls]
Homepage = "https://github.com/2CoderOK/jp-trainer"
Issues = "https://github.com/2CoderOK/jp-trainer/issues"

[tool.hatch.build]
include = [
    "jptrainer/**/*.py",
    "jptrainer/config/*.json",
    "jptrainer/images/**/*.png",
    "jptrainer/audio/**/*.mp3",
]

[tool.hatch.build.targets.wheel]
packages = ["jptrainer"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.3.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.3.0",
]

[tool.hatch.build.targets.sdist]
include = [
    "jptrainer/",
    "README.md",
    "LICENSE",
    "assets/",  # Included in source distribution for GitHub/Reference
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
pythonpath = ["."]